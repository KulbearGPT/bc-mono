services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blackcat
      POSTGRES_PASSWORD: blackcat
      POSTGRES_DB: blackcat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackcat -d blackcat"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -w @blackcat/api"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://blackcat_app:blackcat_app@postgres:5432/blackcat
      API_BASE_URL: http://localhost:3000
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run start -w @blackcat/bot"
    env_file:
      - .env.example
    environment:
      API_BASE_URL: http://api:3000
      DATABASE_URL: postgresql://blackcat_app:blackcat_app@postgres:5432/blackcat
    volumes:
      - .:/workspace
    depends_on:
      api:
        condition: service_started

  dashboard:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -w @blackcat/dashboard"
    env_file:
      - .env.example
    environment:
      API_BASE_URL: http://api:3000
      DATABASE_URL: postgresql://blackcat_app:blackcat_app@postgres:5432/blackcat
    volumes:
      - .:/workspace
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started
