components:
  securitySchemes:
    BotServiceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-bot-service-token
      description: Restricted Sapphire Bot service credential. Actor headers are trusted only after this credential is validated.
    DashboardSession:
      type: apiKey
      in: cookie
      name: p0_session
      description: Server-side Discord OAuth2 staff session. Actor identity and permissions are loaded from the session and database.
    InternalServiceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-internal-service-token
      description: Restricted API worker credential for system-owned jobs such as automatic dispatch.
  parameters:
    SettlementBatchId:
      name: settlementBatchId
      in: path
      required: true
      schema: {type: string, format: uuid}
    WeeklyReportId:
      name: weeklyReportId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ClientSource:
      name: X-Client-Source
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/ActorSource'
      description: Calling surface. It never grants permissions.
      example: DISCORD_BOT
    ActorDiscordUserId:
      name: X-Actor-Discord-User-Id
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/Snowflake'
      description: Required with BotServiceToken for human actions; ignored for DashboardSession authorization.
      example: '123456789012345678'
    ActorDiscordUserIdRequired:
      name: X-Actor-Discord-User-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Snowflake'
      description: Discord actor supplied by the authenticated Bot service; never accepted from an untrusted client.
      example: '123456789012345678'
    ActorGuildId:
      name: X-Actor-Guild-Id
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/Snowflake'
      description: Required with BotServiceToken for a guild-scoped human action.
      example: '987654321098765432'
    ActorGuildIdRequired:
      name: X-Actor-Guild-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Snowflake'
      description: Guild scope supplied by the authenticated Bot service.
      example: '987654321098765432'
    DiscordInteractionId:
      name: X-Discord-Interaction-Id
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/Snowflake'
      description: Optional Discord interaction correlation ID, stored in audit records.
      example: '112233445566778899'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
        pattern: '^[A-Za-z0-9:_-]+$'
      description: Stable intent key. A retry must reuse the original key; the same key with a changed fingerprint returns IDEMPOTENCY_CONFLICT.
      example: discord:112233445566778899
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 100
      description: Optional caller correlation ID; the API always returns a requestId.
      example: req_01J2P0_API
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
      description: Opaque compact HMAC-signed pagination cursor. Cursors are resource-bound, survive API/Bot restarts and multi-instance routing, and malformed, cross-resource or tampered values return 400 rather than being interpreted as offsets or business cursors.
    SortDirection:
      name: sortDirection
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: Resource-whitelisted server-side sort direction. Changing it invalidates an existing cursor and restarts pagination from the first page.
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 8f0de2a5-a8d5-4c24-b32c-4b6673acb510
    SelectionPoolId:
      name: selectionPoolId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SelectionApplicationId:
      name: applicationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ServiceCatalogId:
      name: serviceCatalogId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 4b4aeef1-e4f0-43cf-9716-87a26a1d7299
    GiftCatalogId:
      name: giftCatalogId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: af70de0b-b030-4f44-90b5-fbd0ca368320
    GiftRequestId:
      name: giftRequestId
      in: path
      required: true
      schema:
        type: string
