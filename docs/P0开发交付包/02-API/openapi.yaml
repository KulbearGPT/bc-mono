          properties:
            data: {$ref: '#/components/schemas/StaffCustomerProfile'}
    CustomerProfileNoteEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/CustomerProfileNote'}
    CurrentUserProfileEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
