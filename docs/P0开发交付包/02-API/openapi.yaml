    post:
      tags: [Gifts, Finance]
      operationId: approveGiftRequest
      summary: Authorize a verified gift for idempotent reservation capture
      description: |
        Authorization never accepts or recalculates an amount from the client. It
        revalidates the verification payload hash and short-lived execution credential,
        then either authorizes capture or creates an immutable higher-level approval.
        The capture phase uses the existing FundReservation. With a local reservation fallback it
        first re-reads ledgerBalanceMinor and executes appendWalletDebit under the stable
        key debit:gift:{giftRequestId}:v1. Capture, consumption and Outbox creation
        are coordinated so message retries cannot repeat the debit.
      security:
        - DashboardSession: []
        - BotServiceToken: []
      x-required-permissions: [gift.approve]
      x-minimum-staff-level: L2_SUPERVISOR
      x-amount-policy: L2_UP_TO_200000_USD_MINOR; L3_ABOVE; AT_OR_ABOVE_500000_REQUIRES_L4_DIRECT_EXECUTION
      x-actor-context:
        acceptedSources: [DASHBOARD, DISCORD_BOT]
        resolution: dashboard-session-or-trusted-bot-actor
      x-wallet-operations: [captureReservation, getWalletBalance, appendWalletDebit]
      x-wallet-idempotency-key: debit:gift:{giftRequestId}:v1
      x-fund-effect: capture-active-gift-reservation
      parameters:
        - $ref: '#/components/parameters/GiftRequestId'
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserId'
