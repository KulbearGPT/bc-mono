      allOf:
        - $ref: '#/components/schemas/Money'
        - type: object
          properties:
            amountMinor: {type: integer, format: int64, minimum: 1}
    ReasonCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{2,63}$'
    Version:
      type: integer
      minimum: 1
    OrderStatus:
      type: string
      enum: [DRAFT, PENDING_DISPATCH, ACCEPTED, IN_SERVICE, PENDING_CONFIRMATION, COMPLETED, CANCELLED, EXCEPTION]
    PlayerReviewStatus:
      type: string
      enum: [PENDING_REVIEW, ACTIVE, PAUSED, SUSPENDED]
    PlayerAvailability:
      type: string
      deprecated: true
      description: Legacy migration-only value; it is not configurable and never gates candidate-pool application.
      enum: [AVAILABLE, BUSY, OFFLINE]
    DiscordPresence:
      type: string
      enum: [ONLINE, IDLE, DND, OFFLINE, UNKNOWN]
    StaffTaskStatus:
      type: string
      enum: [OPEN, CLAIMED, VERIFIED, PENDING_APPROVAL, APPROVED, REJECTED, RESOLVED, CANCELLED]
    StaffTaskType:
