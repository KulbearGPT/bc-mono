                guildId: {$ref: '#/components/schemas/DiscordSnowflake'}
                channelId: {$ref: '#/components/schemas/DiscordSnowflake'}
                messageId: {$ref: '#/components/schemas/DiscordSnowflake'}
                eventId: {type: string, maxLength: 150}
                eventType: {type: string, enum: [CREATED, UPDATED, DELETED]}
                authorDiscordId: {anyOf: [{$ref: '#/components/schemas/DiscordSnowflake'}, {type: 'null'}]}
                authorDisplayName: {type: [string, 'null'], maxLength: 100}
                authorIsBot: {type: [boolean, 'null']}
                content: {type: [string, 'null'], maxLength: 4000}
                embeds: {type: array, items: {type: object}}
                attachments: {type: array, items: {type: object}}
                replyToMessageId: {anyOf: [{$ref: '#/components/schemas/DiscordSnowflake'}, {type: 'null'}]}
                discordCreatedAt: {type: [string, 'null'], format: date-time}
                discordEditedAt: {type: [string, 'null'], format: date-time}
      responses:
