          properties:
            data:
              type: object
              required: [initiatorMode, assistedByStaffId, giftAssistChallengeId]
              properties:
                initiatorMode: {const: STAFF_ASSISTED}
                assistedByStaffId: {type: string, format: uuid, readOnly: true}
                giftAssistChallengeId: {type: string, format: uuid, readOnly: true}
    ActorSource:
      type: string
      enum: [DISCORD_BOT, DASHBOARD, SYSTEM_JOB, THIRD_PARTY_WEBHOOK, UNKNOWN]
      description: UNKNOWN is audit-only for rejected requests whose client source cannot be trusted; it is never accepted as an authenticated client source.
    UserStatus:
      type: string
      enum: [ACTIVE, PAUSED, SUSPENDED, DISABLED]
      description: Canonical persisted user state; DISABLED is reserved for internal L4 account termination workflows.
    WritableUserStatus:
      type: string
      enum: [ACTIVE, PAUSED, SUSPENDED]
      description: States accepted by the ordinary operational-status API; DISABLED is intentionally excluded.
    StaffLevel:
      type: string
      enum: [L1_SUPPORT, L2_SUPERVISOR, L3_OPERATIONS, L4_ADMIN_OWNER]
    Snowflake:
      type: string
      pattern: '^[0-9]{17,20}$'
    Currency:
      type: string
      const: CAT
      examples: [CAT]
    Money:
      type: object
      additionalProperties: false
      required: [amountMinor, currency]
      properties:
        amountMinor: {type: integer, format: int64, minimum: 0}
        currency: {$ref: '#/components/schemas/Currency'}
