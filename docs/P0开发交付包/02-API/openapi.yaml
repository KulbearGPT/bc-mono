    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: {type: string, maxLength: 100}
        reason: {type: string, maxLength: 300}
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, retryable, details]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, AUTH_REQUIRED, STAFF_ACCOUNT_REQUIRED, PERMISSION_DENIED, CLIENT_SOURCE_NOT_ACCEPTED, RESOURCE_NOT_FOUND, ACCOUNT_NOT_BOUND, CONFLICT, BINDING_CONFLICT, CONFIG_VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, BUSINESS_RULE_VIOLATION, SERVICE_NOT_AVAILABLE, PLAYER_NOT_ELIGIBLE, REFERRAL_INELIGIBLE, REFERRAL_ATTRIBUTION_CONFLICT, SELF_APPROVAL_FORBIDDEN, STEP_UP_REQUIRED, APPROVAL_PENDING, ROLE_ELEVATION_PENDING, INSUFFICIENT_FUNDS, INSUFFICIENT_AVAILABLE_BALANCE, RESERVATION_CONFLICT, CANCELLATION_PREVIEW_STALE, AUTOMATION_STATE_CONFLICT, SERVICE_UNAVAILABLE]
        message: {type: string, maxLength: 300}
        retryable: {type: boolean}
        details:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/ErrorDetail'}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [requestId, error]
      properties:
        requestId: {type: string}
        error: {$ref: '#/components/schemas/ApiError'}


