      required: [window, orderCount, activeOrderCount, completedOrderCount, cancelledOrderCount, refundCount, orderSpendMinor, giftSpendMinor, refundMinor, totalConsumptionMinor, averageOrderAmountMinor, lastConsumptionAt, currency]
      properties:
        window: {type: string, enum: [DAYS_30, DAYS_90, ALL]}
        orderCount: {type: integer, minimum: 0}
        activeOrderCount: {type: integer, minimum: 0}
        completedOrderCount: {type: integer, minimum: 0}
        cancelledOrderCount: {type: integer, minimum: 0}
        refundCount: {type: integer, minimum: 0}
        orderSpendMinor: {type: integer, minimum: 0}
        giftSpendMinor: {type: integer, minimum: 0}
        refundMinor: {type: integer, minimum: 0}
        totalConsumptionMinor: {type: integer, minimum: 0}
        averageOrderAmountMinor: {type: integer, minimum: 0}
        lastConsumptionAt: {type: [string, 'null'], format: date-time}
        currency: {$ref: '#/components/schemas/Currency'}
    CustomerPreferenceSummary:
      type: object
      additionalProperties: false
      properties:
        preferredGameKeys: {type: array, maxItems: 30, items: {type: string}}
        preferredServiceKeys: {type: array, maxItems: 30, items: {type: string}}
        preferredPlayerUserIds: {type: array, maxItems: 0, deprecated: true, description: Legacy preference surface; current P0 returns an empty array and does not support pre-order preferred players., items: {type: string, format: uuid}}
        lastOrderAt: {type: [string, 'null'], format: date-time}
    AppendCustomerProfileNoteRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 2000}
    CustomerProfileNote:
      type: object
      additionalProperties: false
      required: [id, text, createdAt]
      properties:
        id: {type: string, format: uuid}
        text: {type: string, minLength: 1, maxLength: 2000}
        createdAt: {type: string, format: date-time}
    StaffCustomerProfile:
      type: object
      additionalProperties: false
      required: [user, externalAccountDisplay, balance, statistics, preferences, internalNotes, riskFlags]
      description: Staff-only whitelist. Never exposes referral, beneficiary, rate, commission, margin, profit, or player earning fields. The legacy externalAccountDisplay field is always null in current P0; internal notes are append-only and L1/L2 do not receive author identity.
      properties:
        user: {$ref: '#/components/schemas/ProfileIdentity'}
        externalAccountDisplay: {type: 'null', deprecated: true, description: Legacy compatibility field; current P0 has no external customer account binding.}
        balance: {$ref: '#/components/schemas/BalanceSummary'}
        statistics: {$ref: '#/components/schemas/CustomerStatistics'}
        preferences: {$ref: '#/components/schemas/CustomerPreferenceSummary'}
        internalNotes: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CustomerProfileNote'}}
        riskFlags: {type: array, maxItems: 50, items: {type: string}}
    SelfCustomerProfile:
      type: object
      additionalProperties: false
      required: [user, balance, statistics, activeReservationCount]
      description: Discord self-service whitelist resolved only from trusted Actor Context. Never exposes staff notes, risk flags, referral source or beneficiary facts, rates, commissions, margins, profits, or player earnings. Balance fields follow BalanceSummary nullable stale/unavailable semantics.
      properties:
        user: {$ref: '#/components/schemas/ProfileIdentity'}
        balance: {$ref: '#/components/schemas/BalanceSummary'}
        statistics: {$ref: '#/components/schemas/CustomerStatistics'}
        activeReservationCount: {type: integer, minimum: 0}
    CurrentUserOrderPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [items, nextCursor]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/CurrentUserOrderListItem'}}
                nextCursor: {type: [string, 'null']}
    CurrentUserOrderListItem:
      type: object
      additionalProperties: false
      required: [id, publicId, status, gameKey, serviceKey, playerDisplayName, amountMinor, currency, createdAt, completedAt]
      description: Self-service whitelist. Does not expose customerId, guildId, playerUserId, staff assignment, Wallet transaction, referral, commission, margin, profit, or player earning fields.
      properties:
        id: {type: string, format: uuid}
        publicId: {type: string}
        status: {type: string}
        gameKey: {type: [string, 'null']}
        serviceKey: {type: [string, 'null']}
        playerDisplayName: {type: [string, 'null']}
        amountMinor: {type: integer, format: int64, minimum: 0}
        currency: {$ref: '#/components/schemas/Currency'}
        createdAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
    GiftAffordabilityInput:
      type: object
      additionalProperties: false
      required: [giftCatalogVersionId, participantIds]
      properties:
        giftCatalogVersionId: {type: string, format: uuid}
        participantIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}
    StandaloneGiftSelectionInput:
      type: object
      additionalProperties: false
      required: [playerProfileId, giftCatalogVersionId]
      properties:
        playerProfileId: {type: string, format: uuid}
        giftCatalogVersionId: {type: string, format: uuid}
    StandaloneGiftRequestInput:
      type: object
      additionalProperties: false
      required: [playerProfileId, giftCatalogVersionId, expectedCatalogVersion, expectedPriceMinor, anonymous]
      properties:
        playerProfileId: {type: string, format: uuid}
        giftCatalogVersionId: {type: string, format: uuid}
        expectedCatalogVersion: {$ref: '#/components/schemas/Version'}
        expectedPriceMinor: {type: integer, format: int64, minimum: 1}
        anonymous: {type: boolean, default: false}
    CreateStaffGiftAssistChallengeInput:
      type: object
      additionalProperties: false
      required: [customerDiscordUserId, authorizationChannelId, authorizationMessageId]
      description: The authenticated Bot supplies Discord evidence identifiers after verifying the message author. senderId, staffId, permission level and message content are intentionally not accepted.
      properties:
        customerDiscordUserId: {$ref: '#/components/schemas/Snowflake'}
        authorizationChannelId: {$ref: '#/components/schemas/Snowflake'}
        authorizationMessageId: {$ref: '#/components/schemas/Snowflake'}
    StaffAssistedGiftRequestInput:
      type: object
      additionalProperties: false
      required: [playerProfileId, giftCatalogVersionId, expectedCatalogVersion, expectedPriceMinor, anonymous, authorizationReason, totpCode]
      description: senderId and receiverId are never accepted; customer and receiver ownership are derived from the challenge and PlayerProfile.
      properties:
        playerProfileId: {type: string, format: uuid}
        giftCatalogVersionId: {type: string, format: uuid}
        expectedCatalogVersion: {$ref: '#/components/schemas/Version'}
        expectedPriceMinor: {type: integer, format: int64, minimum: 1}
        anonymous: {type: boolean, default: false}
        authorizationReason: {type: string, minLength: 3, maxLength: 1000}
        totpCode: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
    GiftAffordability:
      type: object
      additionalProperties: false
      required: [giftCatalogVersionId, catalogVersion, priceMinor, recipientCount, totalPriceMinor, ledgerBalanceMinor, reservedMinor, availableMinor, shortfallMinor, currency, calculatedAt, stale, canAfford, topUpInstructions]
      properties:
        giftCatalogVersionId: {type: string, format: uuid}
        catalogVersion: {$ref: '#/components/schemas/Version'}
        priceMinor: {type: integer, minimum: 0}
        recipientCount: {type: integer, minimum: 1}
        totalPriceMinor: {type: integer, minimum: 1}
        ledgerBalanceMinor: {type: integer, minimum: 0}
        reservedMinor: {type: integer, minimum: 0}
        availableMinor: {type: integer, description: May be negative when active reservations exceed the Internal ledger balance.}
        shortfallMinor: {type: integer, minimum: 0}
        currency: {$ref: '#/components/schemas/Currency'}
        calculatedAt: {type: string, format: date-time}
        stale: {type: boolean}
        canAfford: {type: boolean, description: True only for a fresh balance with availableMinor greater than or equal to totalPriceMinor.}
        topUpInstructions: {type: string, minLength: 1, description: Contact-support instructions for submitting payment receipt evidence.}
    GiftAffordabilityEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          required: [data]
          properties: {data: {$ref: '#/components/schemas/GiftAffordability'}}
    StandaloneGiftCenterEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [recipients, balance, items]
              properties:
                recipients:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [playerProfileId, displayName]
                    properties: {playerProfileId: {type: string, format: uuid}, displayName: {type: string}}
                balance: {$ref: '#/components/schemas/BalanceSummary'}
                items: {type: array, items: {$ref: '#/components/schemas/GiftCatalogItem'}}
    StandaloneGiftAffordabilityEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              allOf:
                - {$ref: '#/components/schemas/GiftAffordability'}
                - type: object
                  required: [playerProfileId]
                  properties: {playerProfileId: {type: string, format: uuid}}
    StandaloneGiftRequestEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: true
              required: [id, publicId, origin, senderVisibility, orderId, playerProfileId, receiverId, status, gift, reservation, staffTask, balance, expiresAt]
              properties:
                id: {type: string, format: uuid}
                publicId: {type: string}
                origin: {const: STANDALONE}
                senderVisibility: {type: string, enum: [PUBLIC, ANONYMOUS]}
                orderId: {type: 'null'}
                playerProfileId: {type: string, format: uuid}
                receiverId: {type: string, format: uuid, readOnly: true}
                status: {$ref: '#/components/schemas/GiftRequestStatus'}
    StaffGiftAssistChallengeEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [id, customer, recipients, balance, items, failedAttempts, expiresAt]
              properties:
                id: {type: string, format: uuid}
                customer:
                  type: object
                  additionalProperties: false
                  required: [displayName]
                  properties: {displayName: {type: string}}
                recipients: {type: array, items: {type: object, additionalProperties: false, required: [playerProfileId, displayName], properties: {playerProfileId: {type: string, format: uuid}, displayName: {type: string}}}}
                balance: {$ref: '#/components/schemas/BalanceSummary'}
                items: {type: array, items: {$ref: '#/components/schemas/GiftCatalogItem'}}
                failedAttempts: {type: integer, minimum: 0, maximum: 5}
                expiresAt: {type: string, format: date-time}
