        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example: {requestId: req_error, error: {code: STEP_UP_REQUIRED, message: Recent verification is required., retryable: true, details: [{field: validForSeconds, reason: '900'}]}}
    WalletUnavailable:
      description: Neutral external adapter is temporarily unavailable or incompatible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example: {requestId: req_error, error: {code: SERVICE_UNAVAILABLE, message: The service is temporarily unavailable., retryable: true, details: []}}
    WalletTimeout:
      description: External result may be unknown; query by the original idempotency key before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example: {requestId: req_error, error: {code: SERVICE_UNAVAILABLE, message: The operation result is temporarily unavailable., retryable: true, details: []}}
    ServiceUnavailable:
      description: API or a required readiness dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example: {requestId: req_error, error: {code: SERVICE_UNAVAILABLE, message: Service is unavailable., retryable: true, details: []}}
    BotConfigResponse:
      description: Current validated Guild Bot configuration and actor-manageable fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BotConfigEnvelope'
    BotConfigValidationResponse:
      description: Normalized preview with warnings, errors, caller apply authorization and a short-lived signed validation token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BotConfigValidationEnvelope'
    BotConfigUpdateResponse:
      description: Configuration applied with a new version and append-only audit reference
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BotConfigUpdateEnvelope'
    BotConfigDeliveryTestResponse:
      description: Result of a marked Discord test delivery with no business side effects
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BotConfigDeliveryTestEnvelope'
    BotConfigVersionConflict:
      description: Guild Bot configuration changed after the supplied expectedVersion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example: {requestId: req_error, error: {code: CONFIG_VERSION_CONFLICT, message: Bot configuration changed; refresh before retrying., retryable: false, details: [{field: expectedVersion, reason: current version is 13}]}}
  schemas:
    WalletBalance:
      type: object
      additionalProperties: false
      required: [ledgerBalanceMinor, reservedMinor, availableMinor, currency, calculatedAt, version]
      properties:
        ledgerBalanceMinor: {type: integer, format: int64, minimum: 0}
        reservedMinor: {type: integer, format: int64, minimum: 0}
        availableMinor: {type: integer, format: int64, minimum: 0}
        currency: {type: string, const: CAT}
        calculatedAt: {type: string, format: date-time}
        version: {$ref: '#/components/schemas/Version'}
    WalletEntryDirection:
      type: string
      enum: [CREDIT, DEBIT]
    WalletEntryType:
      type: string
      enum: [TOP_UP_CREDIT, ORDER_CAPTURE_DEBIT, GIFT_CAPTURE_DEBIT, ORDER_REFUND_CREDIT, EXTERNAL_REFUND_DEBIT, ADJUSTMENT_CREDIT, ADJUSTMENT_DEBIT]
    WalletEntry:
      type: object
      additionalProperties: false
      required: [id, walletAccountId, entryType, direction, amountMinor, currency, sourceType, sourceId, reversalOfEntryId, occurredAt]
      properties:
        id: {type: string, format: uuid}
        walletAccountId: {type: string, format: uuid}
        entryType: {$ref: '#/components/schemas/WalletEntryType'}
        direction: {$ref: '#/components/schemas/WalletEntryDirection'}
        amountMinor: {type: integer, format: int64, minimum: 1}
        currency: {type: string, const: CAT}
        sourceType: {type: string, minLength: 1, maxLength: 50}
        sourceId: {type: string, format: uuid}
        reversalOfEntryId: {type: [string, 'null'], format: uuid}
        occurredAt: {type: string, format: date-time}
    ReceiptAttachment:
      type: object
      additionalProperties: false
      required: [id, mediaType, originalFileName, byteSize, sha256, uploadedAt]
      properties:
        id: {type: string, format: uuid}
        mediaType: {type: string, enum: [image/jpeg, image/png, image/webp, application/pdf]}
        originalFileName: {type: string, minLength: 1, maxLength: 255}
        byteSize: {type: integer, minimum: 1, maximum: 10485760}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        uploadedAt: {type: string, format: date-time}
    TopUp:
      type: object
      additionalProperties: false
      required: [id, userId, paidAmountUsdCents, paidCurrency, rateCatPerUsd, creditedCatSubunits, paymentMethod, receiptNumber, paidAt, note, reasonCode, walletEntry, balance, createdAt]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        paidAmountUsdCents: {type: integer, format: int64, minimum: 1}
        paidCurrency: {type: string, const: USD}
        rateCatPerUsd: {type: integer, const: 10}
        creditedCatSubunits: {type: integer, format: int64, minimum: 1}
        paymentMethod: {type: string, enum: [ZELLE, PAYPAL, BANK_TRANSFER, CASH, OTHER]}
        receiptNumber: {type: string, minLength: 1, maxLength: 200}
        paidAt: {type: string, format: date-time}
        note: {type: string, minLength: 1, maxLength: 1000}
        reasonCode: {type: string, minLength: 1, maxLength: 80}
        walletEntry: {$ref: '#/components/schemas/WalletEntry'}
        balance: {$ref: '#/components/schemas/WalletBalance'}
        createdAt: {type: string, format: date-time}
    ExternalRefundDebit:
      type: object
      additionalProperties: false
      required: [id, userId, amountMinor, currency, paymentChannel, externalTransactionId, refundedAt, note, attachmentIds, walletEntry, balance, createdAt]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        amountMinor: {type: integer, format: int64, minimum: 1}
        currency: {type: string, const: CAT}
        paymentChannel: {type: string, minLength: 1, maxLength: 50}
        externalTransactionId: {type: string, minLength: 1, maxLength: 200}
        refundedAt: {type: string, format: date-time}
        note: {type: string, minLength: 1, maxLength: 1000}
        attachmentIds: {type: array, uniqueItems: true, maxItems: 10, items: {type: string, format: uuid}}
        walletEntry: {$ref: '#/components/schemas/WalletEntry'}
        balance: {$ref: '#/components/schemas/WalletBalance'}
        createdAt: {type: string, format: date-time}
    CreateTopUpInput:
      type: object
      additionalProperties: false
      required: [paidAmountUsdCents, paidCurrency, paymentMethod, receiptNumber, paidAt, note, reasonCode]
      properties:
        paidAmountUsdCents: {type: integer, format: int64, minimum: 1}
        paidCurrency: {type: string, const: USD, default: USD}
        paymentMethod: {type: string, enum: [ZELLE, PAYPAL, BANK_TRANSFER, CASH, OTHER]}
        receiptNumber: {type: string, minLength: 1, maxLength: 200}
        paidAt: {type: string, format: date-time}
        note: {type: string, minLength: 1, maxLength: 1000}
        reasonCode: {type: string, minLength: 1, maxLength: 80}
    CreateExternalRefundDebitInput:
      allOf:
        - $ref: '#/components/schemas/CreateTopUpInput'
        - type: object
          required: [expectedWalletVersion]
          properties:
            expectedWalletVersion: {$ref: '#/components/schemas/Version'}
    CreateWalletAdjustmentInput:
      type: object
      additionalProperties: false
      required: [entryType, amountMinor, reversalOfEntryId, reason, expectedWalletVersion]
      properties:
        entryType: {type: string, enum: [ADJUSTMENT_CREDIT, ADJUSTMENT_DEBIT]}
        amountMinor: {type: integer, format: int64, minimum: 1}
        reversalOfEntryId: {type: string, format: uuid}
        reason: {type: string, minLength: 1, maxLength: 1000}
        expectedWalletVersion: {$ref: '#/components/schemas/Version'}
    AuditChangeType:
      type: string
      enum: [CREATE, UPDATE, APPEND, STATE_TRANSITION, INVALIDATE]
    AuditLogChange:
      type: object
      additionalProperties: false
      required: [sequence, targetType, targetId, changeType, beforeSnapshot, afterSnapshot, changedFields]
      properties:
        sequence: {type: integer, minimum: 0}
        targetType: {type: string, minLength: 1, maxLength: 80}
        targetId: {type: string, minLength: 1, maxLength: 100}
        changeType: {$ref: '#/components/schemas/AuditChangeType'}
        beforeSnapshot: {type: [object, 'null'], additionalProperties: true}
        afterSnapshot: {type: [object, 'null'], additionalProperties: true}
        changedFields: {type: array, uniqueItems: true, items: {type: string}}
    WalletBalanceEnvelope:
      allOf: [{$ref: '#/components/schemas/SuccessEnvelopeBase'}, {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/WalletBalance'}}}]
    WalletEntryEnvelope:
      allOf: [{$ref: '#/components/schemas/SuccessEnvelopeBase'}, {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/WalletEntry'}}}]
    WalletEntryPageEnvelope:
      allOf: [{$ref: '#/components/schemas/SuccessEnvelopeBase'}, {type: object, required: [data], properties: {data: {type: object, required: [items, nextCursor], properties: {items: {type: array, items: {$ref: '#/components/schemas/WalletEntry'}}, nextCursor: {$ref: '#/components/schemas/PageCursor'}}}}}]
    TopUpEnvelope:
      allOf: [{$ref: '#/components/schemas/SuccessEnvelopeBase'}, {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/TopUp'}}}]
    ExternalRefundDebitEnvelope:
      allOf: [{$ref: '#/components/schemas/SuccessEnvelopeBase'}, {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/ExternalRefundDebit'}}}]
    ReceiptAttachmentEnvelope:
      allOf: [{$ref: '#/components/schemas/SuccessEnvelopeBase'}, {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/ReceiptAttachment'}}}]
    AuditLogEnvelope:
      allOf: [{$ref: '#/components/schemas/SuccessEnvelopeBase'}, {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/AuditLog'}}}]
    SuccessEnvelopeBase:
      type: object
      required: [requestId]
      properties:
        requestId: {type: string, minLength: 1, maxLength: 128}
    AuditOutcome:
      type: string
      enum: [SUCCEEDED, REJECTED, FAILED]
    SettlementBatchStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, APPROVED, EXPORTED, PARTIALLY_PAID, PAID, VOIDED]
    SettlementBatchSource:
      type: string
      enum: [SCHEDULED, MANUAL]
    SettlementBatchCreateInput:
      type: object
      additionalProperties: false
      required: [source, periodStart, periodEnd, timeZone, currency]
      allOf:
        - if:
            properties: {source: {const: SCHEDULED}}
          then:
            required: [scheduleKey]
            properties: {scheduleKey: {type: string, minLength: 1, pattern: '.*\S.*', maxLength: 120}}
      properties:
        source: {$ref: '#/components/schemas/SettlementBatchSource'}
        scheduleKey: {type: [string, 'null'], minLength: 1, maxLength: 120}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        timeZone: {type: string, maxLength: 80}
        currency: {$ref: '#/components/schemas/Currency'}
        playerUserIds: {type: array, maxItems: 500, items: {type: string, format: uuid}}
    SettlementMutationInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, reasonCode]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        reasonCode: {type: string, minLength: 2, maxLength: 100}
        note: {type: [string, 'null'], maxLength: 1000}
    SettlementVoidInput:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SettlementMutationInput'
        - type: object
          x-replacement-required-statuses: [APPROVED, EXPORTED]
          dependentRequired:
            replacementBatchId: [replacement]
            replacement: [replacementBatchId]
          properties:
            replacementBatchId: {type: [string, 'null'], format: uuid}
            replacement: {$ref: '#/components/schemas/SettlementBatchCreateInput'}
    SettlementPaymentResultInput:
      type: object
      additionalProperties: false
      required: [settlementItemId, expectedVersion, result, amountMinor, currency]
      anyOf:
        - required: [externalBatchReference]
          properties: {externalBatchReference: {type: string, minLength: 1, maxLength: 255}}
        - required: [note]
          properties: {note: {type: string, minLength: 1, maxLength: 1000}}
      properties:
        settlementItemId: {type: string, format: uuid}
        expectedVersion: {type: integer, minimum: 1}
        result: {type: string, enum: [SUCCEEDED, FAILED]}
        amountMinor: {type: integer, minimum: 0}
        currency: {$ref: '#/components/schemas/Currency'}
        externalBatchReference: {type: [string, 'null'], minLength: 1, pattern: '.*\S.*', maxLength: 255}
        note: {type: [string, 'null'], minLength: 1, pattern: '.*\S.*', maxLength: 1000}
    SettlementPaymentResultsInput:
      type: object
      additionalProperties: false
      required: [expectedBatchVersion, results]
      properties:
        expectedBatchVersion: {type: integer, minimum: 1}
        results: {type: array, minItems: 1, maxItems: 500, items: {$ref: '#/components/schemas/SettlementPaymentResultInput'}}
    SettlementItem:
      type: object
      additionalProperties: false
      required: [id, playerUserId, playerDisplayName, playerDiscordUserId, externalAccountDisplay, grossAmountMinor, adjustmentAmountMinor, netAmountMinor, currency, paymentStatus, version, entries, paymentResults]
      properties:
        id: {type: string, format: uuid}
        playerUserId: {type: string, format: uuid}
        playerProfileId: {type: [string, 'null'], format: uuid}
        playerDisplayName: {type: string, maxLength: 200, description: Immutable display-name snapshot captured when the batch is created.}
        playerDiscordUserId: {type: [string, 'null'], maxLength: 32, description: Immutable Discord identifier snapshot.}
        externalAccountDisplay: {type: [string, 'null'], maxLength: 200, description: Immutable masked external-account hint; full account data is forbidden.}
        grossAmountMinor: {type: integer}
        adjustmentAmountMinor: {type: integer}
        netAmountMinor: {type: integer, minimum: 0}
        currency: {$ref: '#/components/schemas/Currency'}
        paymentStatus: {type: string, enum: [PENDING, SUCCEEDED, FAILED]}
        version: {type: integer, minimum: 1}
        entries: {type: array, items: {$ref: '#/components/schemas/SettlementItemEntry'}}
        paymentResults: {type: array, items: {$ref: '#/components/schemas/SettlementPaymentResult'}}
    SettlementItemEntry:
      type: object
      additionalProperties: false
      required: [id, entryType, amountMinor, currency, occurredAt]
      allOf:
        - if:
            properties: {entryType: {const: PLAYER_EARNING}}
          then:
            required: [playerEarningId]
            properties:
              playerEarningId: {type: string, format: uuid}
              playerEarningAdjustmentId: {type: 'null'}
        - if:
            properties: {entryType: {const: EARNING_ADJUSTMENT}}
          then:
            required: [playerEarningAdjustmentId]
            properties:
              playerEarningId: {type: 'null'}
              playerEarningAdjustmentId: {type: string, format: uuid}
      properties:
        id: {type: string, format: uuid}
        entryType: {type: string, enum: [PLAYER_EARNING, EARNING_ADJUSTMENT]}
        playerEarningId: {type: [string, 'null'], format: uuid}
        playerEarningAdjustmentId: {type: [string, 'null'], format: uuid}
        amountMinor: {type: integer}
        currency: {$ref: '#/components/schemas/Currency'}
        occurredAt: {type: string, format: date-time}
    SettlementPaymentResult:
      type: object
      additionalProperties: false
      required: [id, settlementItemId, result, amountMinor, currency, recordedByStaffId, recordedAt]
      anyOf:
        - required: [externalBatchReference]
          properties: {externalBatchReference: {type: string, minLength: 1, pattern: '.*\S.*', maxLength: 255}}
        - required: [note]
          properties: {note: {type: string, minLength: 1, pattern: '.*\S.*', maxLength: 1000}}
      properties:
        id: {type: string, format: uuid}
        settlementItemId: {type: string, format: uuid}
        result: {type: string, enum: [SUCCEEDED, FAILED]}
        amountMinor: {type: integer, minimum: 0}
        currency: {$ref: '#/components/schemas/Currency'}
        externalBatchReference: {type: [string, 'null'], minLength: 1, pattern: '.*\S.*', maxLength: 255}
        note: {type: [string, 'null'], minLength: 1, pattern: '.*\S.*', maxLength: 1000}
        recordedByStaffId: {type: string, format: uuid}
        recordedAt: {type: string, format: date-time}
    SettlementBatch:
      type: object
      additionalProperties: false
      required: [id, guildId, publicId, source, periodStart, periodEnd, cutoffAt, timeZone, currency, grossAmountMinor, adjustmentAmountMinor, netAmountMinor, status, version, items]
      properties:
        id: {type: string, format: uuid}
        guildId: {type: string, pattern: '^[0-9]{17,20}$'}
        publicId: {type: string}
        source: {$ref: '#/components/schemas/SettlementBatchSource'}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        cutoffAt: {type: string, format: date-time, description: Inclusive source snapshot cutoff; distinct from record creation time.}
        timeZone: {type: string}
        currency: {$ref: '#/components/schemas/Currency'}
        grossAmountMinor: {type: integer}
        adjustmentAmountMinor: {type: integer}
        netAmountMinor: {type: integer, minimum: 0}
        status: {$ref: '#/components/schemas/SettlementBatchStatus'}
        version: {type: integer, minimum: 1}
        replacementBatchId: {type: [string, 'null'], format: uuid}
        items: {type: array, items: {$ref: '#/components/schemas/SettlementItem'}}
    SettlementPreview:
      allOf:
        - $ref: '#/components/schemas/SettlementBatch'
        - type: object
          required: [deferredAdjustmentMinor]
          properties:
            deferredAdjustmentMinor: {type: integer, maximum: 0}
    SettlementPreviewEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          required: [data]
          properties: {data: {$ref: '#/components/schemas/SettlementPreview'}}
    SettlementBatchEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          required: [data]
          properties: {data: {$ref: '#/components/schemas/SettlementBatch'}}
    SettlementBatchPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items, nextCursor]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/SettlementBatch'}}
                nextCursor: {type: [string, 'null']}
    WeeklyReport:
      type: object
      additionalProperties: false
      required: [id, reportType, guildId, scheduleKey, periodStart, periodEnd, cutoffAt, timeZone, currency, status, metrics, currentRevision, revisions]
      allOf:
        - if:
            properties: {reportType: {const: PLAYER}}
          then:
            required: [playerUserId]
            properties:
              playerUserId: {type: string, format: uuid}
              metrics: {$ref: '#/components/schemas/PlayerWeeklyReportMetrics'}
              revisions: {type: array, items: {$ref: '#/components/schemas/PlayerWeeklyReportRevision'}}
        - if:
            properties: {reportType: {const: SUMMARY}}
          then:
            properties:
              playerUserId: {type: 'null'}
              metrics: {$ref: '#/components/schemas/SummaryWeeklyReportMetrics'}
              revisions: {type: array, items: {$ref: '#/components/schemas/SummaryWeeklyReportRevision'}}
      properties:
        id: {type: string, format: uuid}
        reportType: {type: string, enum: [PLAYER, SUMMARY]}
        guildId: {type: string, description: Discord Guild scope identifier.}
        scheduleKey: {type: string, minLength: 1, maxLength: 120}
        playerUserId: {type: [string, 'null'], format: uuid}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        cutoffAt: {type: string, format: date-time, description: Immutable source-data cutoff for the base report snapshot.}
        timeZone: {type: string}
        currency: {$ref: '#/components/schemas/Currency'}
        status: {type: string, enum: [READY, NEEDS_REVIEW]}
        metrics: {$ref: '#/components/schemas/WeeklyReportMetrics'}
        currentRevision: {type: integer, minimum: 1}
        revisions: {type: array, items: {$ref: '#/components/schemas/WeeklyReportRevision'} }
    WeeklyReportMetrics:
      oneOf:
        - $ref: '#/components/schemas/PlayerWeeklyReportMetrics'
        - $ref: '#/components/schemas/SummaryWeeklyReportMetrics'
    PlayerWeeklyReportMetrics:
      type: object
      additionalProperties: false
      required: [completedOrderCount, cancelledOrderCount, serviceMinutes, orderEarningMinor, giftEarningMinor, adjustmentMinor, pendingMinor, settlementReadyMinor, batchedMinor]
      properties:
        completedOrderCount: {type: integer, minimum: 0}
        cancelledOrderCount: {type: integer, minimum: 0}
        serviceMinutes: {type: integer, minimum: 0}
        orderEarningMinor: {type: integer}
        giftEarningMinor: {type: integer}
        adjustmentMinor: {type: integer}
        pendingMinor: {type: integer}
        settlementReadyMinor: {type: integer}
        batchedMinor: {type: integer}
    SummaryWeeklyReportMetrics:
      type: object
      additionalProperties: false
      required: [activePlayerCount, completedOrderCount, cancelledOrderCount, exceptionCount, serviceMinutes, grossAmountMinor, adjustmentMinor, pendingMinor, netPayableMinor]
      properties:
        activePlayerCount: {type: integer, minimum: 0}
        completedOrderCount: {type: integer, minimum: 0}
        cancelledOrderCount: {type: integer, minimum: 0}
        exceptionCount: {type: integer, minimum: 0}
        serviceMinutes: {type: integer, minimum: 0}
        grossAmountMinor: {type: integer}
        adjustmentMinor: {type: integer}
        pendingMinor: {type: integer}
        netPayableMinor: {type: integer}
    WeeklyReportRevision:
      oneOf:
        - $ref: '#/components/schemas/PlayerWeeklyReportRevision'
        - $ref: '#/components/schemas/SummaryWeeklyReportRevision'
    PlayerWeeklyReportRevision:
      type: object
      additionalProperties: false
      required: [id, reportType, revision, snapshot, reason, createdByStaffId, createdAt]
      properties:
        id: {type: string, format: uuid}
        reportType: {const: PLAYER}
        revision: {type: integer, minimum: 1}
        snapshot: {$ref: '#/components/schemas/PlayerWeeklyReportMetrics'}
        reason: {type: string, minLength: 2, maxLength: 1000}
        createdByStaffId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    SummaryWeeklyReportRevision:
      type: object
      additionalProperties: false
      required: [id, reportType, revision, snapshot, reason, createdByStaffId, createdAt]
      properties:
        id: {type: string, format: uuid}
        reportType: {const: SUMMARY}
        revision: {type: integer, minimum: 1}
        snapshot: {$ref: '#/components/schemas/SummaryWeeklyReportMetrics'}
        reason: {type: string, minLength: 2, maxLength: 1000}
        createdByStaffId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    WeeklyReportRevisionInput:
      description: The reportType discriminator must equal the persisted report type addressed by weeklyReportId; mismatch returns 409 REPORT_TYPE_MISMATCH with no revision write.
      x-invariant: reportType == storedReport.reportType
      oneOf:
        - $ref: '#/components/schemas/PlayerWeeklyReportRevisionInput'
        - $ref: '#/components/schemas/SummaryWeeklyReportRevisionInput'
    PlayerWeeklyReportRevisionInput:
      type: object
      additionalProperties: false
      required: [reportType, expectedRevision, reason, snapshot]
      properties:
        reportType: {const: PLAYER}
        expectedRevision: {type: integer, minimum: 1}
        reason: {type: string, minLength: 2, maxLength: 1000}
        snapshot: {$ref: '#/components/schemas/PlayerWeeklyReportMetrics'}
    SummaryWeeklyReportRevisionInput:
      type: object
      additionalProperties: false
      required: [reportType, expectedRevision, reason, snapshot]
      properties:
        reportType: {const: SUMMARY}
        expectedRevision: {type: integer, minimum: 1}
        reason: {type: string, minLength: 2, maxLength: 1000}
        snapshot: {$ref: '#/components/schemas/SummaryWeeklyReportMetrics'}
    WeeklyReportEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          required: [data]
          properties: {data: {$ref: '#/components/schemas/WeeklyReport'}}
    WeeklyReportPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items, nextCursor]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/WeeklyReport'}}
                nextCursor: {type: [string, 'null']}
    CurrentPlayerWeeklyReport:
      type: object
      additionalProperties: false
      required: [id, reportType, periodStart, periodEnd, timeZone, currency, status, currentRevision, metrics]
      properties:
        id: {type: string, format: uuid}
        reportType: {const: PLAYER}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        timeZone: {type: string}
        currency: {$ref: '#/components/schemas/Currency'}
