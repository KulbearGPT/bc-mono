      description: The API derives the order and public ticket number from the trusted Guild and channel mapping; the Bot cannot nominate an order. The first qualifying CREATED message from any ACTIVE internal staff level (L1-L4) records first response and, when the order has no assigned task, atomically claims its oldest OPEN order-level StaffTask without replacing an existing owner.
