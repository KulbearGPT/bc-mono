      description: One immutable internal wallet entry
      content: {application/json: {schema: {$ref: '#/components/schemas/WalletEntryEnvelope'}}}
    WalletEntryPageResponse:
      description: Cursor-paginated immutable wallet entries
      content: {application/json: {schema: {$ref: '#/components/schemas/WalletEntryPageEnvelope'}}}
    TopUpResponse:
      description: Immediate receipt-backed wallet credit
      content: {application/json: {schema: {$ref: '#/components/schemas/TopUpEnvelope'}}}
    ExternalRefundDebitResponse:
      description: Internal debit registered after an out-of-band refund
      content: {application/json: {schema: {$ref: '#/components/schemas/ExternalRefundDebitEnvelope'}}}
    ReceiptAttachmentResponse:
      description: Private receipt attachment metadata without a storage key or public URL
      content: {application/json: {schema: {$ref: '#/components/schemas/ReceiptAttachmentEnvelope'}}}
    AuditLogResponse:
      description: Immutable audit header and ordered per-object changes
      content: {application/json: {schema: {$ref: '#/components/schemas/AuditLogEnvelope'}}}
