openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Discord Companion Service Unified Business API
  version: 0.1.0-p0
  summary: Shared P0 business API for Sapphire Bot and React Dashboard
  description: |
    Planned P0 delivery contract for the single business API used by both the
    Sapphire Discord Bot and React Dashboard; it does not claim the product is
    already implemented. Only this API accesses PostgreSQL. The internal CAT
    wallet ledger is the sole customer-balance fact source. External payment
    channels appear only as staff-entered receipt evidence; the API never reads
    their balances or invokes their debit/refund operations. Money is always
    represented as integer CAT subunits. All order flows are immediate;
    scheduling is out of scope.
servers:
  - url: /
    description: Same-origin P0 API; deployments supply their own origin
tags:
  - name: Health
    description: Process liveness and dependency readiness.
  - name: Wallet
    description: Internal CAT balances, receipt-backed credits, debits and immutable entries.
  - name: Catalog
    description: Customer-facing service and gift catalogs and estimates.
  - name: Orders
    description: Immediate order lifecycle shared by Bot and Dashboard.
  - name: Selection
    description: Customer-timed application pools, voice selection and atomic participant finalization.
  - name: Players
    description: Internally approved player qualifications, workbench and non-authoritative presence observations.
  - name: Gifts
    description: Gift request, review, debit outcome and announcement recovery.
  - name: SelfService
    description: Private current-user balance, consumption and commission views.
  - name: Dashboard
    description: Staff operations data exposed through the shared API.
  - name: StaffTasks
    description: Staff takeover, claim, verification and resolution.
  - name: AdminOrders
    description: Staff-scoped order search, refund, resolution and reassignment.
  - name: AdminUsers
    description: Redacted user operations views and non-destructive status control.
  - name: AdminPlayers
    description: Player review, tags and operational status management.
  - name: AdminCatalog
    description: Versioned P0 service and gift catalog administration.
  - name: Finance
    description: Reservations, refunds, referral commissions and player earnings.
  - name: Settlements
    description: Auditable settlement batches, exports and externally completed payment results.
  - name: WeeklyReports
    description: Player and business weekly report snapshots and revisions.
  - name: Profiles
    description: Staff-scoped customer profiles and private current-user profile summaries.
  - name: ReferralAttribution
    description: Confidential referral attribution administration with redacted list boundaries.
  - name: Approvals
    description: Minimum-level approval workflow with higher-level direct execution.
  - name: Audit
    description: Immutable, scope-filtered audit records.
  - name: Jobs
    description: Failed outbox job visibility and display-only retries.
  - name: Access
    description: Staff capabilities, Role mapping, MFA and session revocation.
  - name: BotConfig
    description: Guild-scoped Bot configuration validation, versioned updates and delivery checks.
  - name: Internal
    description: Restricted Bot and system worker integration endpoints.
x-api-boundary:
  databaseAccess: api-only
  sharedClients: [SAPPHIRE_BOT, REACT_DASHBOARD]
  externalResponsibilities: [OUT_OF_BAND_PAYMENT_RECEIPT, OUT_OF_BAND_REFUND_RECEIPT]
  localFacts:
    - WALLET_ACCOUNT
    - WALLET_ENTRY
    - TOP_UP
    - EXTERNAL_REFUND_DEBIT
    - RECEIPT_ATTACHMENT
    - ORDER
    - DISPATCH
    - GIFT
    - FUND_RESERVATION
    - REFERRAL_ATTRIBUTION
    - COMMISSION
    - CONSUMPTION
    - PLAYER_EARNING
    - SETTLEMENT_BATCH
    - WEEKLY_REPORT
    - STAFF_TASK
    - APPROVAL
    - AUDIT
    - GUILD_BOT_CONFIG
x-rbac-inheritance: CUMULATIVE
x-rbac-level-order: [L1_SUPPORT, L2_SUPERVISOR, L3_OPERATIONS, L4_ADMIN_OWNER]
x-approval-execution: MINIMUM_LEVEL_DIRECT
x-money-policy:
  representation: minor-units-integer
  currency: CAT
  prototypeCurrency: CAT
x-customer-display-unit:
  defaultName: 猫条
  defaultSymbol: CAT
  subunitsPerCat: 10
  canonicalCurrency: CAT
  scope: CUSTOMER_WALLET_AND_SPEND_PRESENTATION_ONLY
x-unified-spend-policy:
  rule: all-order-and-gift-spend-must-enter-through-this-api
  bypassForbidden: true
  balanceFactSource: INTERNAL_APPEND_ONLY_WALLET_LEDGER
  directOrderOrGiftDebitForbidden: true
x-fund-reservation-policy:
  derivedBalanceFormula: availableMinor = ledgerBalanceMinor - reservedMinor
  activeStatuses: [PENDING, ACTIVE, DISPUTED, PARTIALLY_SETTLED]
  orderLifecycle:
    reserveOn: ORDER_SUBMIT
    captureOn: ORDER_COMPLETE
    dispatchTimeout: KEEP_RESERVATION_AND_OFFER_CONTINUE_OR_CANCEL
    releaseOn: [USER_CANCELLED, RESERVATION_EXPIRED, REJECTED, FAILED]
  giftLifecycle:
    reserveOn: GIFT_REQUEST_CREATE
    captureOn: GIFT_APPROVAL
    releaseOn: [WITHDRAWN, REJECTED, EXPIRED, FAILED]
  partialResolution: capture-decided-amount-and-release-remainder
  postCaptureCorrection: append-refund-or-adjustment-never-release-captured-reservation
x-concurrency-policy:
  mutableWritesRequireExpectedVersion: true
  reservationMutationsAreAtomicWithBusinessTransition: true
  stableIdempotencyRequiredForWrites: true
  staleVersionError: CONFLICT
  changedFingerprintError: IDEMPOTENCY_CONFLICT
x-referral-confidentiality-policy:
  programs: [PROMOTER_FIRST_PURCHASE, PLAYER_LIFETIME]
  oneActiveAttributionPerReferredCustomer: true
  programsMutuallyExclusive: true
  referredCustomerForbiddenFields: [source, beneficiary, programType, rate, amount, status]
  beneficiarySelfViewMasksSourceCustomer: true
  confidentialDetailMinimumLevel: L3_OPERATIONS
  confidentialReadsAudited: true
x-order-policy:
  type: IMMEDIATE_ONLY
  maxActiveOrdersPerCustomer: 1
  maxActiveOrdersPerPlayer: 1
x-role-policy:
  fixedLevels: [L1_SUPPORT, L2_SUPERVISOR, L3_OPERATIONS, L4_ADMIN_OWNER]
  inheritance: higher-level-includes-all-lower-level-execution-permissions
  authorizationRule: actor-rank-greater-than-or-equal-to-required-rank
  l1DestructiveOrFinancialExecution: forbidden-except-top-up-at-or-below-500000
  topUpPolicy:
    l1InclusiveLimitMinor: 500000
    currency: CAT
    aboveLimitMinimumLevel: L2_SUPERVISOR
    separateReviewerRequired: false
  l2GiftApprovalLimit:
    amountMinor: 200000
    currency: CAT
  l2RefundLimit:
    amountMinor: 50000
    currency: CAT
  highValueDirectExecution:
    amountMinor: 500000
    currency: CAT
    minimumLevel: L4_ADMIN_OWNER
    sameActorMayInitiateAndExecute: true
    separateReviewerRequired: false
  safeguards: [REASON_REQUIRED, STEP_UP_REQUIRED, IMMUTABLE_AUDIT]
x-record-retention-policy:
  hardDeleteForbidden:
    - orders
    - orderEvents
    - orderResolutions
    - walletEntries
    - topUps
    - externalRefundDebits
    - receiptAttachments
    - consumptions
    - gifts
    - commissions
    - playerEarnings
    - refunds
    - auditLogs
    - auditLogChanges
    - guildBotConfigEvents

x-m22-gift-contract:
  status: IMPLEMENTED_API
  description: M22-US-02 implements the unified API; the persistent Discord entry remains M22-US-03.
  requestRules:
    recipientSelector: playerProfileId
    senderVisibility: anonymous
    receiverRule: receiverId is never accepted; the API derives the receiver from the trusted same-Guild active player profile.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check process liveness
      security: []
      x-required-permissions: []
      x-actor-context:
        source: NONE
        resolution: not-applicable
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check API dependency readiness
      security: []
      x-required-permissions: []
      x-actor-context:
        source: NONE
        resolution: not-applicable
      responses:
        '200':
          $ref: '#/components/responses/ReadinessResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'


  /api/v1/me:
    get:
      tags: [SelfService]
      operationId: getCurrentUser
      x-operation-aliases: [getMyServiceCenter]
      summary: Get the current actor service-center summary
      security:
        - BotServiceToken: []
        - DashboardSession: []
      x-required-permissions: [account.self.read]
      x-actor-context:
        acceptedSources: [DISCORD_BOT, DASHBOARD]
        resolution: bot-discord-headers-or-dashboard-session
      parameters:
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserId'
        - $ref: '#/components/parameters/ActorGuildId'
        - $ref: '#/components/parameters/DiscordInteractionId'
      responses:
        '200':
          $ref: '#/components/responses/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '503':
          $ref: '#/components/responses/WalletUnavailable'

  /api/v1/me/balance:
    get:
      tags: [SelfService]
      operationId: getCurrentBalance
      x-operation-aliases: [getMyBalance]
      summary: Get internal ledger balance, active reservations and derived available balance
      security:
        - BotServiceToken: []
        - DashboardSession: []
      x-required-permissions: [balance.self.read]
      x-actor-context:
        acceptedSources: [DISCORD_BOT, DASHBOARD]
        resolution: bot-discord-headers-or-dashboard-session
      parameters:
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserId'
        - $ref: '#/components/parameters/ActorGuildId'
        - $ref: '#/components/parameters/DiscordInteractionId'
      responses:
        '200':
          $ref: '#/components/responses/BalanceResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '503':
          $ref: '#/components/responses/WalletUnavailable'
        '504':
          $ref: '#/components/responses/WalletTimeout'

  /api/v1/me/consumptions:
    get:
      tags: [SelfService]
      operationId: listCurrentUserConsumptions
      x-operation-aliases: [listMyConsumptions]
      summary: List the current user's order, gift and reversal consumption records
      security:
        - BotServiceToken: []
        - DashboardSession: []
      x-required-permissions: [consumption.self.read]
      x-actor-context:
        acceptedSources: [DISCORD_BOT, DASHBOARD]
        resolution: bot-discord-headers-or-dashboard-session
      parameters:
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserId'
        - $ref: '#/components/parameters/ActorGuildId'
        - $ref: '#/components/parameters/DiscordInteractionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          $ref: '#/components/responses/ConsumptionPageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/PermissionError'

  /api/v1/me/commissions:
    get:
      tags: [SelfService]
      operationId: listCurrentUserCommissions
      x-operation-aliases: [listMyCommissions]
      summary: List commissions where the current actor is the beneficiary
      description: |
        Returns only records whose beneficiary is the current actor. Source
        customers are masked and the response DTO contains no source customer ID,
        beneficiary ID, attribution ID or configured rate. It never reveals a
        referred customer's own attribution merely because that customer calls /me.
      security:
        - BotServiceToken: []
        - DashboardSession: []
      x-required-permissions: [commission.self.read]
      x-response-data-policy: beneficiary-only-with-masked-source-customer
      x-actor-context:
        acceptedSources: [DISCORD_BOT, DASHBOARD]
        resolution: bot-discord-headers-or-dashboard-session
      parameters:
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserId'
        - $ref: '#/components/parameters/ActorGuildId'
        - $ref: '#/components/parameters/DiscordInteractionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          $ref: '#/components/responses/CurrentCommissionPageResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/PermissionError'

  /api/v1/me/staff-tasks:
    get:
      tags: [CurrentUser, StaffTasks]
      operationId: listCurrentUserStaffTasks
      summary: List the current user's redacted support-task progress
      description: Returns only tasks whose customer is the current actor; internal notes, staff-only evidence and restricted referral fields are always omitted.
      security:
        - BotServiceToken: []
        - DashboardSession: []
      x-required-permissions: [account.self.read]
      x-authorization-rules: [owner-only, self-safe-redaction]
      x-actor-context:
        acceptedSources: [DISCORD_BOT, DASHBOARD]
        resolution: bot-discord-headers-or-dashboard-session
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserId'
        - $ref: '#/components/parameters/ActorGuildId'
        - $ref: '#/components/parameters/DiscordInteractionId'
      responses:
        '200':
          $ref: '#/components/responses/StaffTaskPageResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/PermissionError'

  /api/v1/services:
    get:
      tags: [Catalog]
      operationId: listServices
      x-operation-aliases: [listServiceCatalog]
      summary: List enabled services with customer prices only
      security:
        - BotServiceToken: []
        - DashboardSession: []
      x-required-permissions: [service.read]
      x-actor-context:
        acceptedSources: [DISCORD_BOT, DASHBOARD]
        resolution: bot-discord-headers-or-dashboard-session
      parameters:
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserId'
        - $ref: '#/components/parameters/ActorGuildId'
        - name: game
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: region
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          $ref: '#/components/responses/ServiceListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/PermissionError'

  /api/v1/services/{serviceCatalogId}/estimate:
    post:
      tags: [Catalog]
      operationId: estimateService
      summary: Estimate an immediate service without creating or mutating an order
      security:
        - BotServiceToken: []
        - DashboardSession: []
      x-required-permissions: [service.estimate]
      x-actor-context:
        acceptedSources: [DISCORD_BOT, DASHBOARD]
        resolution: bot-discord-headers-or-dashboard-session
      parameters:
        - $ref: '#/components/parameters/ServiceCatalogId'
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserId'
        - $ref: '#/components/parameters/ActorGuildId'
        - $ref: '#/components/parameters/DiscordInteractionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/EstimateServiceBody'
      responses:
        '200':
          $ref: '#/components/responses/EstimateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/ServiceNotAvailable'

  /api/v1/gift-center:
    get:
      tags: [Gifts, SelfService]
      operationId: getStandaloneGiftCenter
      summary: List same-Guild active companions and gifts for order-independent gifting
      security: [{BotServiceToken: []}]
      x-required-permissions: [gift.request]
      x-actor-context: {acceptedSources: [DISCORD_BOT], resolution: current-discord-user-only}
      x-recipient-policy: same-guild-active-player-profile-derived-receiver
      parameters:
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserIdRequired'
        - $ref: '#/components/parameters/ActorGuildIdRequired'
        - $ref: '#/components/parameters/DiscordInteractionId'
      responses:
        '200': {$ref: '#/components/responses/StandaloneGiftCenterResponse'}
        '403': {$ref: '#/components/responses/PermissionError'}
        '503': {$ref: '#/components/responses/WalletUnavailable'}

  /api/v1/gift-center/affordability:
    post:
      tags: [Gifts, SelfService]
      operationId: checkStandaloneGiftAffordability
      summary: Check one standalone recipient and gift without writing business facts
      security: [{BotServiceToken: []}]
      x-required-permissions: [gift.request]
      x-record-policy: read-only-no-gift-reservation-task-or-outbox-write
      x-actor-context: {acceptedSources: [DISCORD_BOT], resolution: current-discord-user-only}
      parameters:
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserIdRequired'
        - $ref: '#/components/parameters/ActorGuildIdRequired'
        - $ref: '#/components/parameters/DiscordInteractionId'
      requestBody: {$ref: '#/components/requestBodies/StandaloneGiftSelectionBody'}
      responses:
        '200': {$ref: '#/components/responses/StandaloneGiftAffordabilityResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFoundError'}
        '409': {$ref: '#/components/responses/ConflictError'}
        '503': {$ref: '#/components/responses/WalletUnavailable'}

  /api/v1/gift-center/gift-requests:
    post:
      tags: [Gifts, SelfService]
      operationId: createStandaloneGiftRequest
      summary: Atomically reserve one order-independent gift for a derived receiver
      description: receiverId is never accepted. The API locks and revalidates the same-Guild ACTIVE playerProfileId, catalog version, price and wallet before creating one gift, reservation and review task.
      security: [{BotServiceToken: []}]
      x-required-permissions: [gift.request]
      x-actor-context: {acceptedSources: [DISCORD_BOT], resolution: current-discord-user-only}
      x-fund-effect: create-active-gift-reservation-atomically
      parameters:
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserIdRequired'
        - $ref: '#/components/parameters/ActorGuildIdRequired'
        - $ref: '#/components/parameters/DiscordInteractionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {$ref: '#/components/requestBodies/StandaloneGiftRequestBody'}
      responses:
        '201': {$ref: '#/components/responses/StandaloneGiftRequestResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/PermissionError'}
        '404': {$ref: '#/components/responses/NotFoundError'}
        '409': {$ref: '#/components/responses/ConflictError'}
        '422': {$ref: '#/components/responses/BusinessRuleError'}
        '503': {$ref: '#/components/responses/WalletUnavailable'}

  /api/v1/admin/gift-assist/challenges:
    post:
      tags: [Gifts, StaffAssist]
      operationId: createStaffGiftAssistChallenge
      summary: Bind one Discord staff actor to a same-Guild customer authorization message
      description: The Bot verifies that the target message was authored by the nominated non-bot customer in the current Guild. The API independently resolves the ACTIVE customer and approved staff accounts from Discord bindings; senderId is never accepted.
      security: [{BotServiceToken: []}]
      x-required-permissions: [gift.assist]
      x-actor-context: {acceptedSources: [DISCORD_BOT], resolution: current-discord-staff-only}
      x-authorization-mode: direct-staff-confirmation-with-totp
      x-record-policy: ten-minute-five-attempt-single-use-challenge
      parameters:
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserIdRequired'
        - $ref: '#/components/parameters/ActorGuildIdRequired'
        - $ref: '#/components/parameters/DiscordInteractionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {$ref: '#/components/requestBodies/CreateStaffGiftAssistChallengeBody'}
      responses:
        '201': {$ref: '#/components/responses/StaffGiftAssistChallengeResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/PermissionError'}
        '404': {$ref: '#/components/responses/NotFoundError'}
        '409': {$ref: '#/components/responses/ConflictError'}

  /api/v1/admin/gift-assist/challenges/{giftAssistChallengeId}:
    get:
      tags: [Gifts, StaffAssist]
      operationId: getStaffGiftAssistChallenge
      summary: Reload the owner-bound assisted gift center without exposing another customer
      security: [{BotServiceToken: []}]
      x-required-permissions: [gift.assist]
      x-actor-context: {acceptedSources: [DISCORD_BOT], resolution: current-discord-staff-only}
      parameters:
        - $ref: '#/components/parameters/GiftAssistChallengeId'
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserIdRequired'
        - $ref: '#/components/parameters/ActorGuildIdRequired'
        - $ref: '#/components/parameters/DiscordInteractionId'
      responses:
        '200': {$ref: '#/components/responses/StaffGiftAssistChallengeResponse'}
        '403': {$ref: '#/components/responses/PermissionError'}
        '404': {$ref: '#/components/responses/NotFoundError'}
        '409': {$ref: '#/components/responses/ConflictError'}

  /api/v1/admin/gift-assist/challenges/{giftAssistChallengeId}/affordability:
    post:
      tags: [Gifts, StaffAssist]
      operationId: checkStaffGiftAssistAffordability
      summary: Check the bound customer's balance without writing gift or fund facts
      security: [{BotServiceToken: []}]
      x-required-permissions: [gift.assist]
      x-actor-context: {acceptedSources: [DISCORD_BOT], resolution: current-discord-staff-only}
      x-record-policy: read-only-no-gift-reservation-task-or-outbox-write
      parameters:
        - $ref: '#/components/parameters/GiftAssistChallengeId'
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserIdRequired'
        - $ref: '#/components/parameters/ActorGuildIdRequired'
        - $ref: '#/components/parameters/DiscordInteractionId'
      requestBody: {$ref: '#/components/requestBodies/StaffGiftAssistSelectionBody'}
      responses:
        '200': {$ref: '#/components/responses/StandaloneGiftAffordabilityResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/PermissionError'}
        '404': {$ref: '#/components/responses/NotFoundError'}
        '409': {$ref: '#/components/responses/ConflictError'}
        '503': {$ref: '#/components/responses/WalletUnavailable'}

  /api/v1/admin/gift-assist/challenges/{giftAssistChallengeId}/gift-requests:
    post:
      tags: [Gifts, StaffAssist]
      operationId: createStaffAssistedGiftRequest
      summary: Directly reserve the challenge-bound customer's balance after staff TOTP
      description: senderId and receiverId are never accepted. The API verifies the current staff permission and permissions_version, the single-use challenge, six-digit TOTP, mandatory reason, same-Guild customer and player, catalog price and locked customer wallet in one finalization boundary. The proof is never stored or logged.
      security: [{BotServiceToken: []}]
      x-required-permissions: [gift.assist]
      x-actor-context: {acceptedSources: [DISCORD_BOT], resolution: current-discord-staff-only}
      x-authorization-mode: direct-staff-confirmation-with-totp
      x-fund-effect: create-active-customer-gift-reservation-atomically
      parameters:
        - $ref: '#/components/parameters/GiftAssistChallengeId'
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserIdRequired'
        - $ref: '#/components/parameters/ActorGuildIdRequired'
        - $ref: '#/components/parameters/DiscordInteractionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {$ref: '#/components/requestBodies/StaffAssistedGiftRequestBody'}
      responses:
        '201': {$ref: '#/components/responses/StaffAssistedGiftRequestResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/PermissionError'}
        '404': {$ref: '#/components/responses/NotFoundError'}
        '409': {$ref: '#/components/responses/ConflictError'}
        '422': {$ref: '#/components/responses/BusinessRuleError'}
