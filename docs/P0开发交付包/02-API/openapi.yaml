      x-required-permissions: [customer_profile.note.append]
      x-minimum-staff-level: L1_SUPPORT
      x-authorization-rules: [same-customer-scope-predicate, l1-assigned-order-or-task-scope, l2-guild-scope, append-only]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AppendCustomerProfileNoteRequest'}}}
      responses:
        '201': {$ref: '#/components/responses/CustomerProfileNoteResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/PermissionError'}
        '404': {$ref: '#/components/responses/NotFoundError'}

  /api/v1/admin/users/{userId}/orders:
    get:
      tags: [Profiles, AdminUsers, Orders]
      operationId: listAdminCustomerOrders
      summary: List customer orders in the actor's staff scope
      security: [{DashboardSession: []}]
