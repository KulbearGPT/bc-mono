      responses:
        '200': {$ref: '#/components/responses/OrderPageResponse'}
        '403': {$ref: '#/components/responses/PermissionError'}

  /api/v1/me/profile:
    get:
      tags: [Profiles, SelfService]
      operationId: getCurrentUserProfileSummary
      summary: Get the current Discord user's private profile and balance freshness
      description: Resolves the user only from trusted Discord Bot Actor Context. Reuses the nullable stale/unavailable balance module; statistics and business lists use the trusted Guild, while reservedMinor and availableMinor cover every active reservation against the user's global Wallet account across all Guilds.
      security: [{BotServiceToken: []}]
      x-required-permissions: [account.self.read]
      x-actor-context: {acceptedSources: [DISCORD_BOT], resolution: current-discord-user-only}
      parameters:
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserIdRequired'
        - $ref: '#/components/parameters/ActorGuildIdRequired'
        - $ref: '#/components/parameters/DiscordInteractionId'
      responses:
        '200': {$ref: '#/components/responses/CurrentUserProfileResponse'}
        '404': {$ref: '#/components/responses/NotFoundError'}
        '503': {$ref: '#/components/responses/WalletUnavailable'}

  /api/v1/me/orders:
    get:
      tags: [Profiles, SelfService, Orders]
      operationId: listCurrentUserOrders
      summary: List only the current Discord user's orders
      security: [{BotServiceToken: []}]
      x-required-permissions: [order.read]
      x-actor-context: {acceptedSources: [DISCORD_BOT], resolution: current-discord-user-only}
      parameters:
        - $ref: '#/components/parameters/ClientSource'
        - $ref: '#/components/parameters/ActorDiscordUserIdRequired'
        - $ref: '#/components/parameters/ActorGuildIdRequired'
