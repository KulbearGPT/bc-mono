<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>黑猫电竞 · Discord 点菜式下单流程原型</title>
  <style>
    :root{color-scheme:dark;--bg:#111214;--rail:#1e1f22;--panel:#2b2d31;--card:#313338;--line:#3f4147;--muted:#b5bac1;--text:#f2f3f5;--brand:#5865f2;--brand2:#8c7cff;--cyan:#31c8c3;--green:#23a559;--yellow:#f0b232;--red:#da373c}
    *{box-sizing:border-box}body{margin:0;background:#0d0e10;color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}
    .guide{position:sticky;top:0;height:100vh;padding:28px 22px;background:linear-gradient(180deg,#171822,#111216);border-right:1px solid #292b31;overflow:auto}.brand{display:flex;gap:12px;align-items:center}.brand-mark{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#8d7cff,#3b61d1);box-shadow:0 8px 30px #5865f244;font-size:22px}.brand strong{display:block;letter-spacing:.12em}.brand small,.guide p{color:var(--muted)}.guide h1{font-size:24px;line-height:1.25;margin:34px 0 10px}.guide p{font-size:14px;line-height:1.7}.steps{list-style:none;padding:0;margin:30px 0}.steps li{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:11px 0;color:#7d8189}.steps b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#292b30;font-size:12px}.steps li.active{color:#fff}.steps li.active b{background:var(--brand)}.steps li.done{color:#b9c0ff}.steps li.done b{background:#394174}.rule{padding:13px;border:1px solid #343741;border-radius:12px;background:#191a1f;font-size:13px;color:#c9cbd0;line-height:1.55}.rule strong{color:#7de2dd}.reset{width:100%;margin-top:18px;padding:11px;border:1px solid #42444c;border-radius:9px;color:#ddd;background:#24252a;cursor:pointer}
    .stage{min-width:0;background:#313338}.discord-head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #26272b;box-shadow:0 1px 0 #0003}.discord-head strong:before{content:'#';margin-right:8px;color:#949ba4}.discord-head span{font-size:12px;color:#949ba4}.chat{max-width:990px;margin:0 auto;padding:34px 30px 80px}.message{display:grid;grid-template-columns:44px 1fr;gap:16px;margin-bottom:28px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f0d4bd,#8b6b5a);font-size:23px}.meta{margin:0 0 7px}.meta strong{color:#67d4d0}.meta .app{margin-left:7px;padding:2px 5px;border-radius:4px;background:#5865f2;font-size:11px}.meta time{margin-left:8px;color:#949ba4;font-size:12px}.bubble{max-width:820px}.embed{position:relative;padding:22px 24px;border-radius:4px;background:#2b2d31;border:1px solid #3d3f45;box-shadow:0 1px 2px #0004}.embed:before{content:"";position:absolute;left:-5px;top:-1px;bottom:-1px;width:5px;border-radius:4px 0 0 4px;background:var(--cyan)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;color:#9da5ff;text-transform:uppercase}.embed h2{margin:8px 0 5px;font-size:24px}.embed .intro{color:#d7d9dc;margin:0 0 18px;line-height:1.6}.progress{display:flex;gap:6px;margin:14px 0 20px}.progress span{height:4px;flex:1;border-radius:5px;background:#44464d}.progress span.on{background:linear-gradient(90deg,var(--brand),var(--cyan))}.summary-strip{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.pill{padding:6px 9px;border-radius:8px;background:#212328;border:1px solid #41434a;color:#cfd1d5;font-size:12px}.pill.game{color:#b9c4ff;border-color:#5865f299;background:#252a46}.section{margin-top:18px;padding-top:16px;border-top:1px solid #42444a}.section h3{margin:0 0 6px;font-size:15px}.section p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
    .v2-caption{display:flex;align-items:center;gap:7px;margin:14px 0 8px;color:#949ba4;font-size:11px;font-weight:800;letter-spacing:.1em}.v2-caption:before{content:"COMPONENTS V2";padding:3px 6px;border-radius:4px;background:#444868;color:#d9dcff}.v2-container{overflow:hidden;border:1px solid #45474f;border-radius:10px;background:#292b30}.v2-section{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;padding:15px 16px;border-top:1px solid #41434a}.v2-section:first-child{border-top:0}.v2-section.is-active{background:#343748;box-shadow:inset 3px 0 #7d86f5}.v2-section strong{display:block;margin-bottom:4px;font-size:15px}.v2-section small{display:block;color:#b5bac1;line-height:1.45}.v2-section .price{display:inline-block;margin-top:7px;color:#72dcd7;font-weight:800}.v2-section .code{margin-left:7px;color:#8e95a0;font-size:10px}.v2-section .accessory{min-width:72px}.empty{padding:24px;text-align:center;color:#a4a8af;border:1px dashed #555860;border-radius:10px}
    .components{max-width:820px;margin-top:10px}.select-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.discord-select{width:100%;height:44px;padding:0 42px 0 13px;border:1px solid #1e1f22;border-radius:4px;background:#1e1f22;color:#dbdee1;font-size:14px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#b5bac1 50%),linear-gradient(135deg,#b5bac1 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.btn{height:38px;padding:0 15px;border:0;border-radius:4px;background:#4e5058;color:#fff;font-weight:650;cursor:pointer}.btn:hover{filter:brightness(1.12)}.btn.primary{background:#5865f2}.btn.success{background:#248046}.btn.danger{background:#da373c}.btn.ghost{background:#35373c;border:1px solid #4c4f57}.btn:disabled{opacity:.45;cursor:not-allowed}.hint{margin:9px 0 0;color:#949ba4;font-size:12px}
    .preview{margin-top:14px;padding:15px;background:#25262b;border:1px solid #42444a;border-radius:9px}.preview-head{display:flex;justify-content:space-between;gap:16px}.preview h3{margin:0;font-size:17px}.preview .price{font-weight:800;color:#7fe1dc}.slot-list{display:grid;gap:8px;margin-top:13px}.slot{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px;border-radius:7px;background:#313338;border:1px solid #45474d}.slot-num{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;background:#45485b;color:#cbd0ff;font-weight:800}.slot strong{display:block;font-size:14px}.slot small{color:#aeb2b8}.slot button{border:0;background:transparent;color:#aeb4ff;cursor:pointer}.cart-group{margin-top:14px;border:1px solid #45474d;border-radius:10px;overflow:hidden}.cart-group>header{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:#24262b}.cart-group>header strong{font-size:14px}.cart-group>header button{border:0;background:none;color:#aeb4ff;cursor:pointer}.cart-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding:13px;border-top:1px solid #3d3f45}.cart-row .origin{display:inline-block;margin-top:4px;padding:2px 6px;border-radius:4px;background:#454963;color:#cbd0ff;font-size:10px}.cart-row .cost{font-weight:700;color:#d8dadf}.total{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;padding-top:15px;border-top:1px solid #45474d}.total small{display:block;color:#a7abb2}.total strong{font-size:23px;color:#7fe1dc}.notice{margin-top:14px;padding:11px 13px;border-radius:7px;background:#292c38;color:#c8ccff;font-size:12px;line-height:1.55}
    .toast{position:fixed;right:24px;bottom:24px;padding:12px 16px;border-radius:8px;background:#111214;border:1px solid #3d4048;box-shadow:0 14px 40px #0008;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.modal-backdrop{position:fixed;inset:0;z-index:5;background:#000a;display:grid;place-items:center;padding:20px}.modal{width:min(520px,100%);border-radius:8px;background:#313338;box-shadow:0 24px 70px #000;padding:22px}.modal h2{margin:0 0 6px}.modal>p{margin:0 0 18px;color:#b5bac1;font-size:13px}.field{display:block;margin:13px 0}.field span{display:block;margin-bottom:6px;font-size:13px;font-weight:700}.field select,.field input,.field textarea{width:100%;border:1px solid #1e1f22;border-radius:4px;background:#1e1f22;color:#fff;padding:0 11px}.field select,.field input{height:42px}.field textarea{min-height:120px;padding:11px;resize:vertical;font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.hidden{display:none!important}
    @media(max-width:820px){.shell{grid-template-columns:1fr}.guide{position:relative;height:auto;padding:18px 18px 12px}.guide h1,.guide p,.rule{display:none}.steps{display:flex;margin:16px 0 4px;overflow:auto;gap:12px}.steps li{min-width:max-content;display:flex;align-items:center}.reset{position:absolute;right:18px;top:18px;width:auto;margin:0}.chat{padding:24px 14px 60px}.message{grid-template-columns:36px 1fr;gap:10px}.avatar{width:36px;height:36px}.embed{padding:18px 16px}.v2-section{gap:10px;padding:13px 12px}.v2-section .accessory{min-width:60px;padding:0 10px}.select-row{grid-template-columns:1fr}.discord-head span{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <aside class="guide">
      <div class="brand"><span class="brand-mark">🐈‍⬛</span><div><strong>BLACKCAT</strong><small>交互原型 · v0.2 / Components V2</small></div></div>
      <h1>像点菜一样下单</h1>
      <p>每次只进入一个游戏菜单。套餐与单点都由该游戏的服务目录筛选；套餐加入后，每一个陪玩席位仍可单独换项目、时长和偏好。</p>
      <ol class="steps" id="steps">
        <li class="active" data-step="1"><b>1</b><span>选择游戏</span></li>
        <li data-step="2"><b>2</b><span>浏览菜单</span></li>
        <li data-step="3"><b>3</b><span>调整清单</span></li>
        <li data-step="4"><b>4</b><span>确认订单</span></li>
      </ol>
      <div class="rule"><strong>原型约束</strong><br>Discord Modal 无法动态级联，所以游戏切换、菜单筛选和席位选择都通过“提交一次 → Bot 编辑原消息”完成。</div>
      <button class="reset" id="reset">重新体验</button>
    </aside>
    <section class="stage">
      <header class="discord-head"><strong>订单-p-demo26</strong><span>仅你、Bot 与客服可见</span></header>
      <div class="chat">
        <article class="message">
          <div class="avatar">🐈</div>
          <div class="bubble">
            <p class="meta"><strong>黑猫黑猫喵喵喵</strong><span class="app">APP</span><time>刚刚</time></p>
            <div class="embed" id="embed"></div>
            <div class="components" id="components"></div>
          </div>
        </article>
      </div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <div id="modal-root"></div>
  <script>
    const catalog={
      lol:{code:'LOLNA',name:'英雄联盟美服',emoji:'⚔️',services:[
        {id:'lol-ranked',name:'技术陪玩',region:'北美',minutes:60,price:30,note:'上分、复盘与对线建议'},
        {id:'lol-fun',name:'娱乐陪玩',region:'北美',minutes:60,price:20,note:'轻松聊天、匹配与大乱斗'},
        {id:'lol-coach',name:'复盘指导',region:'北美',minutes:45,price:35,note:'单局复盘与提升建议'}],packages:[
        {id:'lol-duo',name:'双猫上分车队',desc:'一个技术位负责节奏，一个娱乐位负责气氛。',price:46,slots:[['lol-ranked','负责技术护航'],['lol-fun','会聊天，氛围轻松']]},
        {id:'lol-squad',name:'灵活组排小队',desc:'三人组排阵容，可逐席位换成技术或娱乐陪玩。',price:72,slots:[['lol-ranked','主指挥'],['lol-ranked','补位技术'],['lol-fun','聊天陪伴']]}]},
      valorant:{code:'VALORANT',name:'无畏契约',emoji:'🎯',services:[
        {id:'val-ranked',name:'竞技上分',region:'北美',minutes:60,price:32,note:'沟通、报点与上分'},
        {id:'val-fun',name:'娱乐陪玩',region:'北美',minutes:60,price:22,note:'匹配、乱斗与聊天'}],packages:[
        {id:'val-duo',name:'双排上分搭子',desc:'技术位配合娱乐位，只展示无畏契约项目。',price:50,slots:[['val-ranked','负责技术带队'],['val-fun','负责交流气氛']]}]},
      delta:{code:'DELTA',name:'三角洲行动',emoji:'🛡️',services:[
        {id:'delta-escort',name:'技术护航',region:'北美',minutes:60,price:38,note:'路线、物资与撤离护航'},
        {id:'delta-chat',name:'娱乐陪伴',region:'北美',minutes:60,price:20,note:'能沟通，会聊天就行'}],packages:[
        {id:'delta-team',name:'烽火双猫护航',desc:'默认双技术位，也可以把其中一席改成聊天陪伴。',price:70,slots:[['delta-escort','负责路线与撤离'],['delta-escort','负责战斗掩护']]}]}
    };
    const state={screen:'game',game:null,selected:null,cart:[],packageGroups:[],editing:null,orderNote:''};
    const embed=document.querySelector('#embed'),components=document.querySelector('#components'),modalRoot=document.querySelector('#modal-root');
    const money=n=>n.toFixed(1)+' CAT';
    function currentGame(){return state.game?catalog[state.game]:null}
    function service(id){for(const game of Object.values(catalog)){const found=game.services.find(x=>x.id===id);if(found)return found}return null}
    function toast(text){const el=document.querySelector('#toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
    function setStep(n){document.querySelectorAll('.steps li').forEach(li=>{const v=Number(li.dataset.step);li.classList.toggle('active',v===n);li.classList.toggle('done',v<n)})}
    function header(step,title,intro){return `<span class="eyebrow">ORDER P-DEMO26 · STEP ${step}/4</span><h2>${title}</h2><p class="intro">${intro}</p><div class="progress">${[1,2,3,4].map(n=>`<span class="${n<=step?'on':''}"></span>`).join('')}</div>`}
    function render(){modalRoot.innerHTML='';if(state.screen==='game')renderGame();if(state.screen==='menu'){renderMenu();renderOrderNoteControl()}if(state.screen==='cart')renderCart();if(state.screen==='confirm'){renderConfirm();renderConfirmationOrderNote()}}
    function renderGame(){setStep(1);embed.innerHTML=header(1,'先选今天想玩的游戏','像翻开一张菜单：每一行都是 Discord Components V2 的 Section，实际可点击的是右侧原生按钮。')+`<div class="v2-caption">SECTION + BUTTON</div><div class="v2-container">${Object.entries(catalog).map(([id,g])=>`<section class="v2-section"><div><strong>${g.emoji} ${g.name}<span class="code">${g.code}</span></strong><small>${g.services.length} 个单点 · ${g.packages.length} 个套餐；进入后只显示本游戏目录。</small></div><button class="btn primary accessory" data-enter-game="${id}">进入</button></section>`).join('')}</div><div class="notice">整行文字不是可点击区域；按钮会触发 Interaction，Bot 再编辑原消息进入对应游戏菜单。</div>`;components.innerHTML=`${state.cart.length?'<div class="buttons"><button class="btn ghost" id="view-cart">查看已点清单</button></div>':''}<p class="hint">真实 Discord：Container 内放多个 Section，每个 Section 的 accessory 是 Button。</p>`;document.querySelectorAll('[data-enter-game]').forEach(el=>el.onclick=()=>{state.game=el.dataset.enterGame;state.selected=null;state.screen='menu';render()});document.querySelector('#view-cart')?.addEventListener('click',()=>{state.screen='cart';render()})}
    function menuItems(g){return [...g.packages.map(x=>({kind:'package',...x})),...g.services.map(x=>({kind:'single',...x}))]}
    function renderMenu(){setStep(2);const g=currentGame();if(!state.selected)state.selected=g.packages.length?`package:${g.packages[0].id}`:`single:${g.services[0]?.id||''}`;const [kind,id]=state.selected.split(':');const item=kind==='package'?g.packages.find(x=>x.id===id):g.services.find(x=>x.id===id);embed.innerHTML=header(2,`${g.emoji} ${g.name} · 今日菜单`,'套餐使用 Section 右侧按钮预览；数量更多的单点项目放进下方 String Select。两者都只来自当前游戏。')+`<div class="summary-strip"><span class="pill game">当前游戏 · ${g.name}</span><span class="pill">套餐 ${g.packages.length}</span><span class="pill">单点 ${g.services.length}</span></div><div class="v2-caption">套餐 · SECTION + BUTTON</div>${g.packages.length?`<div class="v2-container">${g.packages.map(x=>`<section class="v2-section ${state.selected===`package:${x.id}`?'is-active':''}"><div><strong>${x.name}</strong><small>${x.desc}</small><span class="price">${money(x.price)}</span></div><button class="btn ${state.selected===`package:${x.id}`?'success':'primary'} accessory" data-package="${x.id}">${state.selected===`package:${x.id}`?'已预览':'查看'}</button></section>`).join('')}</div>`:'<div class="empty">当前游戏暂无套餐</div>'}${item?preview(kind,item,g):'<div class="empty">请选择一个项目</div>'}`;components.innerHTML=`${g.services.length?`<div class="v2-caption">单点 · STRING SELECT</div><div class="select-row"><select class="discord-select" id="menu-select" aria-label="单点添加陪玩"><option value="" ${kind==='package'?'selected':''} disabled>选择一个单点陪玩项目</option>${g.services.map(x=>`<option value="single:${x.id}" ${state.selected===`single:${x.id}`?'selected':''}>${x.name}｜${money(x.price)}｜${x.minutes} 分钟</option>`).join('')}</select><button class="btn success" id="add-item">${kind==='package'?'采用套餐':'单点加入'}</button></div>`:''}<div class="buttons"><button class="btn ghost" id="change-game">换一个游戏</button>${state.cart.length?'<button class="btn primary" id="view-cart">查看清单 · '+state.cart.length+'</button>':''}</div><p class="hint">套餐按钮与单点 Select 都会产生 Interaction；Bot 收到后更新同一条 Components V2 消息。</p>`;document.querySelectorAll('[data-package]').forEach(el=>el.onclick=()=>{state.selected=`package:${el.dataset.package}`;render()});document.querySelector('#menu-select')?.addEventListener('change',e=>{state.selected=e.currentTarget.value;render()});document.querySelector('#add-item')?.addEventListener('click',()=>addSelected(kind,item,g));document.querySelector('#change-game').onclick=()=>{state.screen='game';state.game=null;state.selected=null;render()};document.querySelector('#view-cart')?.addEventListener('click',()=>{state.screen='cart';render()})}
    function renderOrderNoteControl(){const row=components.querySelector('.buttons');if(!row)return;const button=document.createElement('button');button.className='btn ghost';button.id='order-note';button.textContent=state.orderNote?'修改需求备注':'填写需求备注';row.prepend(button);const note=document.createElement('div');note.className='notice';note.textContent=`需求备注：${state.orderNote||'未填写'}`;embed.append(note);button.onclick=openOrderNoteModal}
    function openOrderNoteModal(){modalRoot.innerHTML=`<div class="modal-backdrop"><form class="modal" id="order-note-form"><h2>📝 填写需求备注</h2><p>这是整张订单的需求描述；单个席位的偏好仍可在下一步分别填写。</p><label class="field"><span>补充备注（可选）</span><textarea name="orderNote" maxlength="500" placeholder="例如：希望轻松聊天，不急着上分">${state.orderNote}</textarea></label><div class="modal-actions"><button class="btn ghost" type="button" id="close-order-note">取消</button><button class="btn primary">保存备注</button></div></form></div>`;document.querySelector('#close-order-note').onclick=()=>modalRoot.innerHTML='';document.querySelector('#order-note-form').onsubmit=e=>{e.preventDefault();state.orderNote=String(new FormData(e.currentTarget).get('orderNote')).trim();render();toast(state.orderNote?'需求备注已保存':'需求备注已清空')}}
    function renderConfirmationOrderNote(){const section=document.createElement('section');section.className='section';section.innerHTML=`<h3>需求备注</h3><p>${state.orderNote||'未填写'}</p>`;embed.querySelector('.total')?.before(section)}
    function preview(kind,item,g){if(kind==='single')return `<div class="preview"><div class="preview-head"><div><span class="eyebrow">单点陪玩项目</span><h3>${g.name} · ${item.name}</h3></div><span class="price">${money(item.price)}</span></div><p class="hint">${item.region} · ${item.minutes} 分钟 · 1 位陪玩</p></div>`;return `<div class="preview"><div class="preview-head"><div><span class="eyebrow">套餐预览</span><h3>${item.name}</h3></div><span class="price">${money(item.price)}</span></div><p class="hint">${item.desc}</p><div class="slot-list">${item.slots.map((slot,i)=>{const s=service(slot[0]);return `<div class="slot"><span class="slot-num">${i+1}</span><div><strong>${g.name} · ${s.name}</strong><small>${slot[1]}</small></div><span>${money(s.price)}</span></div>`}).join('')}</div></div>`}
    function addSelected(kind,item,g){if(kind==='single'){state.cart.push({id:crypto.randomUUID(),game:state.game,origin:'单点',packageName:null,packageGroupId:null,serviceId:item.id,units:1,note:item.note,price:item.price})}else{const groupId=crypto.randomUUID(),catalogSubtotal=item.slots.reduce((sum,slot)=>sum+service(slot[0]).price,0);state.packageGroups.push({id:groupId,game:state.game,name:item.name,adjustment:item.price-catalogSubtotal});item.slots.forEach((slot,i)=>{const s=service(slot[0]);state.cart.push({id:crypto.randomUUID(),game:state.game,origin:`套餐席位 ${i+1}`,packageName:item.name,packageGroupId:groupId,serviceId:s.id,units:1,note:slot[1],price:s.price})})}toast(kind==='package'?'套餐已放入清单，可逐席位调整':'单点陪玩已加入');state.screen='cart';render()}
    function groups(){return state.cart.reduce((acc,item)=>((acc[item.game]??=[]).push(item),acc),{})}
    function activePackageGroups(){const ids=new Set(state.cart.map(item=>item.packageGroupId).filter(Boolean));return state.packageGroups.filter(group=>ids.has(group.id))}
    function catalogSubtotal(){return state.cart.reduce((sum,item)=>sum+item.price*item.units,0)}
    function packageAdjustment(){return activePackageGroups().reduce((sum,group)=>sum+group.adjustment,0)}
    function total(){return catalogSubtotal()+packageAdjustment()}
    function renderCart(){setStep(3);embed.innerHTML=header(3,'检查并调整陪玩清单','套餐只是快捷配菜：每个席位仍是独立项目，可以换成同游戏的其他服务、修改时长或备注；也可以继续单点。')+Object.entries(groups()).map(([gameId,items])=>{const g=catalog[gameId];return `<section class="cart-group"><header><strong>${g.emoji} ${g.name} · ${items.length} 位陪玩</strong><button data-add-game="${gameId}">＋ 在这个游戏继续点</button></header>${items.map((item,i)=>{const s=service(item.serviceId);return `<div class="cart-row"><span class="slot-num">${i+1}</span><div><strong>${s.name} · ${item.units*s.minutes} 分钟</strong><small>${item.note||'未填写偏好'}</small><br><span class="origin">${item.packageName?item.packageName+' · ':''}${item.origin}</span></div><div><span class="cost">${money(item.price*item.units)}</span><br><button class="btn ghost" data-edit="${item.id}" style="margin-top:7px;height:30px">编辑</button></div></div>`}).join('')}</section>`}).join('')+`${activePackageGroups().length?`<div class="summary-strip"><span class="pill">目录小计 ${money(catalogSubtotal())}</span>${activePackageGroups().map(group=>`<span class="pill game">${group.name} 调整 ${group.adjustment>=0?'+':''}${money(group.adjustment)}</span>`).join('')}</div>`:''}<div class="total"><div><small>共需 ${state.cart.length} 位陪玩</small><span>套餐编辑后由 API 重新计算调整额</span></div><strong>${money(total())}</strong></div><div class="notice">游戏隔离规则：编辑英雄联盟席位时，只能替换成英雄联盟服务；要新增无畏契约项目，需要先进入无畏契约菜单。</div>`;components.innerHTML=`<div class="buttons"><button class="btn primary" id="add-more">＋ 添加其他游戏或单点</button><button class="btn success" id="confirm" ${state.cart.length?'':'disabled'}>下一步 · 确认订单</button></div>`;document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>openEditor(el.dataset.edit));document.querySelectorAll('[data-add-game]').forEach(el=>el.onclick=()=>{state.game=el.dataset.addGame;state.selected=null;state.screen='menu';render()});document.querySelector('#add-more').onclick=()=>{state.game=null;state.selected=null;state.screen='game';render()};document.querySelector('#confirm').onclick=()=>{state.screen='confirm';render()}}
    function openEditor(id){const item=state.cart.find(x=>x.id===id),g=catalog[item.game],s=service(item.serviceId);modalRoot.innerHTML=`<div class="modal-backdrop"><form class="modal" id="edit-form"><h2>编辑这个陪玩席位</h2><p>${g.name} · ${item.packageName||'单点项目'}。可替换项仅来自当前游戏。</p><label class="field"><span>陪玩项目</span><select name="serviceId">${g.services.map(x=>`<option value="${x.id}" ${x.id===item.serviceId?'selected':''}>${x.name} · ${money(x.price)}</option>`).join('')}</select></label><label class="field"><span>计费单位数</span><input name="units" type="number" min="1" max="12" value="${item.units}"></label><label class="field"><span>偏好备注</span><input name="note" maxlength="100" value="${item.note||''}"></label><div class="modal-actions"><button class="btn danger" type="button" id="remove">移除席位</button><button class="btn ghost" type="button" id="close-modal">取消</button><button class="btn primary">保存修改</button></div></form></div>`;document.querySelector('#close-modal').onclick=()=>modalRoot.innerHTML='';document.querySelector('#remove').onclick=()=>{state.cart=state.cart.filter(x=>x.id!==id);state.packageGroups=activePackageGroups();render();toast('已从清单移除')};document.querySelector('#edit-form').onsubmit=e=>{e.preventDefault();const data=new FormData(e.currentTarget),next=service(data.get('serviceId'));Object.assign(item,{serviceId:next.id,units:Number(data.get('units')),note:String(data.get('note')),price:next.price});render();toast('席位已更新')}}
    function renderConfirm(){setStep(4);embed.innerHTML=header(4,'订单清单已就绪','这是提交前的最终确认。价格、余额、目录有效性与套餐调整仍由业务 API 在同一边界重新校验。')+`<div class="summary-strip"><span class="pill">${Object.keys(groups()).length} 个游戏</span><span class="pill">${state.cart.length} 位陪玩</span><span class="pill game">预计 ${money(total())}</span></div>${Object.entries(groups()).map(([gameId,items])=>{const g=catalog[gameId];return `<section class="section"><h3>${g.emoji} ${g.name}</h3>${items.map((item,i)=>{const s=service(item.serviceId);return `<p>${i+1}. ${s.name} · ${item.units*s.minutes} 分钟 · ${money(item.price*item.units)}<br>　${item.packageName?'来自 '+item.packageName+'；':''}${item.note||'无额外偏好'}</p>`}).join('')}</section>`}).join('')}${activePackageGroups().length?`<section class="section"><h3>价格构成</h3><p>目录小计 ${money(catalogSubtotal())} · 套餐调整 ${packageAdjustment()>=0?'+':''}${money(packageAdjustment())}</p></section>`:''}<div class="total"><div><small>Sandbox 测试环境</small><span>确认后创建资金预留，不立即扣款</span></div><strong>${money(total())}</strong></div>`;components.innerHTML=`<div class="buttons"><button class="btn ghost" id="back-cart">返回编辑</button><button class="btn success" id="submit-order">确认提交订单</button></div>`;document.querySelector('#back-cart').onclick=()=>{state.screen='cart';render()};document.querySelector('#submit-order').onclick=()=>toast('原型：此处将调用 API 提交订单')}
    document.querySelector('#reset').onclick=()=>{Object.assign(state,{screen:'game',game:null,selected:null,cart:[],packageGroups:[],editing:null,orderNote:''});render()};render();
  </script>
</body>
</html>
